<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡STOP! Multijugador</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="game-header">
        <h1>¡STOP! Online</h1>
        <div id="user-badge" class="badge"></div>
    </header>

    <main class="container">
        <section id="screen-lobby" class="card">
            <h2>Ingresar a la Sala</h2>
            <div class="form-group" id="login-box">
                <input type="text" id="username" placeholder="Tu Apodo / Nombre" required>
                <button id="btn-entrar" class="btn">Unirse a la partida</button>
            </div>
            <div id="lobby-status" class="hidden">
                <p class="loading">Esperando que se inicie la ronda...</p>
                <button id="btn-iniciar-juego" class="btn btn-start">Iniciar Juego</button>
            </div>
        </section>

        <section id="screen-game" class="card hidden">
            <div class="game-info">
                <div class="letra-box">Letra: <span id="active-letter">-</span></div>
            </div>
            
            <form id="stop-form">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="ans-nombre" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Apellido</label>
                    <input type="text" id="ans-apellido" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Ciudad / País</label>
                    <input type="text" id="ans-ciudad" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Fruta / Alimento</label>
                    <input type="text" id="ans-fruta" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <input type="text" id="ans-color" autocomplete="off">
                </div>
                
                <button type="button" id="btn-stop" class="btn btn-danger">¡¡STOP!!</button>
            </form>
        </section>

        <section id="screen-results" class="card hidden">
            <h2>Resultados de la ronda</h2>
            <p id="stop-announcer"></p>
            <div class="table-responsive">
                <table id="results-table">
                    <thead>
                        <tr>
                            <th>Jugador</th>
                            <th>Nom</th>
                            <th>Ape</th>
                            <th>Ciu</th>
                            <th>Fru</th>
                            <th>Col</th>
                        </tr>
                    </thead>
                    <tbody id="results-body"></tbody>
                </table>
            </div>
            <button id="btn-volver-lobby" class="btn" style="margin-top: 20px;">Nueva Ronda</button>
        </section>
    </main>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
