<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOP! Arena - Ingresar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: linear-gradient(135deg, #0f0c1b 0%, #1a103c 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #fff; }
        .card { background: rgba(25, 18, 50, 0.95); padding: 40px 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); text-align: center; max-width: 400px; width: 100%; border: 1px solid rgba(255, 255, 255, 0.05); }
        h1 { font-size: 32px; font-weight: 900; background: linear-gradient(45deg, #ff007f, #7000ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        p { color: #b9b6d3; margin-bottom: 30px; font-size: 14px; }
        .btn-google { background: #fff; color: #000; font-weight: bold; padding: 14px; border: none; border-radius: 10px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; font-size: 16px; transition: transform 0.2s; }
        .btn-google:hover { transform: scale(1.02); background: #f1f1f1; }
    </style>
</head>
<body>

    <div class="card">
        <h1>STOP! MULTIPLAYER</h1>
        <p>Inicia sesión para guardar tus monedas, apuestas y victorias en la nube.</p>
        <button id="btn-login" class="btn-google">
            <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/web-24dp/copy_vector.svg" alt="Google" width="20">
            Continuar con Google
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDbg6O6VUUBfh0BMVbSaJe1WOmSZwoOBhg",
            authDomain: "stop-e29f9.firebaseapp.com",
            projectId: "stop-e29f9",
            storageBucket: "stop-e29f9.firebasestorage.app",
            messagingSenderId: "640082897243",
            appId: "1:640082897243:web:2a0e913941b84227bd527e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // Si ya está logueado, redirigir automáticamente al menú
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = "menu.html";
            }
        });

        document.getElementById('btn-login').addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // Verificar si es un usuario nuevo en Firestore para regalarle monedas iniciales
                const userRef = doc(db, "usuarios", user.uid);
                const userSnap = await getDoc(userRef);

                if (!userSnap.exists()) {
                    await setDoc(userRef, {
                        nombre: user.displayName,
                        email: user.email,
                        monedas: 200 // Monedas de regalo iniciales para apostar
                    });
                }

                window.location.href = "menu.html";
            } catch (error) {
                console.error("Error en login:", error);
                alert("No se pudo iniciar sesión con Google.");
            }
        });
    </script>
</body>
</html>
